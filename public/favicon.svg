<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <!-- Solid White Background matching reference image -->
  <rect width="100%" height="100%" fill="#FFFFFF" rx="4" />

  <g id="towers">
    <!-- Tower 1: Cyan / Blue (#009FE3) -->
    <polygon points="62,175 114,78 126,82 74,175" fill="#101010" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" />
    <polygon points="62,175 114,78 162,96 162,175" fill="#009FE3" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Tower 2: Red (#E30613) -->
    <polygon points="162,120 186,42 195,46 171,123" fill="#101010" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" />
    <polygon points="162,175 162,120 186,42 216,56 216,175" fill="#E30613" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Tower 3: Yellow-Orange (#FAA61A) -->
    <polygon points="216,92 238,10 247,14 225,95" fill="#101010" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" />
    <polygon points="216,175 216,92 238,10 270,26 270,175" fill="#FAA61A" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Tower 4: Lime Green (#8CC63F) -->
    <polygon points="270,55 284,22 291,25 277,58" fill="#101010" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" />
    <polygon points="270,175 270,26 308,44 308,175" fill="#8CC63F" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" />
  </g>

  <!-- Double-Framed Typography Box -->
  <g id="typography">
    <!-- Top Double Horizontal Bar Lines -->
    <line x1="20" y1="175" x2="340" y2="175" stroke="#000000" stroke-width="4.5" stroke-linecap="square" />
    <line x1="20" y1="183" x2="340" y2="183" stroke="#000000" stroke-width="2.5" stroke-linecap="square" />

    <!-- STEELAGE -->
    <text x="180" y="244" fill="#000000" font-family="Impact, 'Arial Black', 'Franklin Gothic Bold', 'Trebuchet MS', sans-serif" font-size="58" font-weight="900" letter-spacing="1.2" text-anchor="middle">STEELAGE</text>

    <!-- CONSTRUCTION LTD -->
    <text x="180" y="286" fill="#000000" font-family="Impact, 'Arial Black', 'Franklin Gothic Bold', 'Trebuchet MS', sans-serif" font-size="29" font-weight="900" letter-spacing="1" text-anchor="middle">CONSTRUCTION LTD</text>

    <!-- Bottom Double Horizontal Bar Lines -->
    <line x1="20" y1="297" x2="340" y2="297" stroke="#000000" stroke-width="2.5" stroke-linecap="square" />
    <line x1="20" y1="305" x2="340" y2="305" stroke="#000000" stroke-width="4.5" stroke-linecap="square" />
  </g>
</svg>
