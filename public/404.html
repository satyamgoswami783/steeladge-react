<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Steelage Construction Ltd</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #08171A;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    .container {
      max-width: 520px;
      width: 100%;
      background: rgba(11, 32, 37, 0.7);
      border: 1px solid rgba(200, 149, 82, 0.25);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .logo {
      height: 70px;
      width: auto;
      margin-bottom: 1.5rem;
    }
    .code {
      font-size: 3.5rem;
      font-weight: 800;
      color: #D3A15D;
      line-height: 1;
      margin-bottom: 0.5rem;
      letter-spacing: -1px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    p {
      color: #94A3B8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #C89552 0%, #B88542 100%);
      color: #08171A;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      padding: 0.75rem 1.75rem;
      border-radius: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(200, 149, 82, 0.35);
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/logo-transparent-light.png" alt="Steelage Construction Ltd" class="logo">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for does not exist or has been moved. Return to the home page to explore our commercial construction services.</p>
    <a href="/" class="btn">Return to Home</a>
  </div>
  <script>
    // SPA fallback: If loaded via browser direct navigation on an SPA route, try to route client-side
    (function() {
      var path = window.location.pathname;
      if (path && path !== '/' && path !== '/404' && path !== '/404.html') {
        // Redirect to root with path preserved for React Router if needed
        window.location.replace('/#' + path);
      }
    })();
  </script>
</body>
</html>
