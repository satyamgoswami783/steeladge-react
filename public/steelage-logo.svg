<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="720" height="660" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <!-- 4 Architectural 3D Towers - Symmetrical Blue/Red Peaked Structure matching Image 2 -->
  <g id="towers">
    <!-- Blue Left Slope -->
    <polygon points="60,175 168,48 168,175" fill="#009FE3" stroke="#000000" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Center 3D Black Shadow Facet -->
    <polygon points="156,175 168,48 178,54 166,175" fill="#101010" stroke="#000000" stroke-width="3" stroke-linejoin="round" />

    <!-- Red Right Slope (Equal Peak meeting at 168,48) -->
    <polygon points="168,48 218,118 218,175" fill="#E30613" stroke="#000000" stroke-width="4" stroke-linejoin="round" />

    <!-- Tower 3: Yellow-Orange (#FAA61A) - Tall Skyscraper -->
    <polygon points="218,92 240,10 249,14 227,95" fill="#101010" stroke="#000000" stroke-width="4" stroke-linejoin="round" />
    <polygon points="218,175 218,92 240,10 272,26 272,175" fill="#FAA61A" stroke="#000000" stroke-width="4" stroke-linejoin="round" />

    <!-- Tower 4: Lime Green (#8CC63F) - Rightmost Skyscraper -->
    <polygon points="272,55 286,22 293,25 279,58" fill="#101010" stroke="#000000" stroke-width="4" stroke-linejoin="round" />
    <polygon points="272,175 272,26 310,44 310,175" fill="#8CC63F" stroke="#000000" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- Double-Framed Black Typography Box -->
  <g id="typography">
    <!-- Top Double Horizontal Bar Lines -->
    <line x1="20" y1="175" x2="340" y2="175" stroke="#000000" stroke-width="5" stroke-linecap="square" />
    <line x1="20" y1="184" x2="340" y2="184" stroke="#000000" stroke-width="3" stroke-linecap="square" />

    <!-- STEELAGE -->
    <text x="180" y="244" fill="#000000" font-family="Impact, 'Arial Black', 'Franklin Gothic Bold', 'Trebuchet MS', sans-serif" font-size="58" font-weight="900" letter-spacing="1.2" text-anchor="middle">STEELAGE</text>

    <!-- CONSTRUCTION LTD -->
    <text x="180" y="286" fill="#000000" font-family="Impact, 'Arial Black', 'Franklin Gothic Bold', 'Trebuchet MS', sans-serif" font-size="29" font-weight="900" letter-spacing="1" text-anchor="middle">CONSTRUCTION LTD</text>

    <!-- Bottom Double Horizontal Bar Lines -->
    <line x1="20" y1="297" x2="340" y2="297" stroke="#000000" stroke-width="3" stroke-linecap="square" />
    <line x1="20" y1="305" x2="340" y2="305" stroke="#000000" stroke-width="5" stroke-linecap="square" />
  </g>
</svg>
